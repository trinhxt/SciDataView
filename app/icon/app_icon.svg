<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="512" height="512" viewBox="0 0 512 512" version="1.1" id="scidataview-liquid-glass">
  <defs>
    <!-- Squircle Clip Path -->
    <clipPath id="squircleClip">
      <rect x="36" y="36" width="440" height="440" rx="98" ry="98" />
    </clipPath>

    <!-- Opaque Frosted White-Gray Substrate (Nền trắng xám đục) -->
    <linearGradient id="liquidBg" x1="0.1" y1="0.0" x2="0.9" y2="1.0">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="30%" stop-color="#F1F5F9" />
      <stop offset="70%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Frosted Caustic Wave 1 -->
    <linearGradient id="caustic1" x1="0.0" y1="0.0" x2="1.0" y2="1.0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.60" />
      <stop offset="45%" stop-color="#E2E8F0" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.0" />
    </linearGradient>

    <!-- Frosted Caustic Wave 2 -->
    <linearGradient id="caustic2" x1="1.0" y1="0.0" x2="0.0" y2="1.0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.50" />
      <stop offset="50%" stop-color="#F1F5F9" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Beveled Frosted Rim Gradient -->
    <linearGradient id="prismaticRim" x1="0.0" y1="0.0" x2="0.8" y2="1.0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#E2E8F0" stop-opacity="0.75" />
      <stop offset="70%" stop-color="#94A3B8" stop-opacity="0.50" />
      <stop offset="100%" stop-color="#64748B" stop-opacity="0.40" />
    </linearGradient>

    <!-- Glossy Liquid Surface Glare -->
    <linearGradient id="surfaceGlare" x1="0.2" y1="0.0" x2="0.5" y2="1.0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.70" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Tube Glass Sheen (Left vertical highlight) -->
    <linearGradient id="glassStreak" x1="0.0" y1="0.0" x2="1.0" y2="0.0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.90" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Right Side Refraction Tint -->
    <linearGradient id="glassRightRefract" x1="0.0" y1="0.0" x2="1.0" y2="0.0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.0" />
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.55" />
    </linearGradient>

    <!-- Clip Paths for Liquid Cores (Ensuring full-height 50/50 highlights conform to liquid border) -->
    <clipPath id="liquidClip1">
      <path d="M 100 282 L 100 370 A 16 16 0 0 0 116 386 L 132 386 A 16 16 0 0 0 148 370 L 148 282 A 24 6 0 0 0 100 282 Z" />
    </clipPath>
    <clipPath id="liquidClip2">
      <path d="M 184 202 L 184 370 A 16 16 0 0 0 200 386 L 216 386 A 16 16 0 0 0 232 370 L 232 202 A 24 6 0 0 0 184 202 Z" />
    </clipPath>
    <clipPath id="liquidClip3">
      <path d="M 268 252 L 268 370 A 16 16 0 0 0 284 386 L 300 386 A 16 16 0 0 0 316 370 L 316 252 A 24 6 0 0 0 268 252 Z" />
    </clipPath>
    <clipPath id="liquidClip4">
      <path d="M 352 152 L 352 370 A 16 16 0 0 0 368 386 L 384 386 A 16 16 0 0 0 400 370 L 400 152 A 24 6 0 0 0 352 152 Z" />
    </clipPath>

    <!-- Liquid Gradient Vial 1: Glowing Aqua/Cyan -->
    <linearGradient id="liquidVial1" x1="0.5" y1="0.0" x2="0.5" y2="1.0">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="40%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Liquid Gradient Vial 2: Glowing Neon Violet/Orchid -->
    <linearGradient id="liquidVial2" x1="0.5" y1="0.0" x2="0.5" y2="1.0">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="35%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Liquid Gradient Vial 3: Glowing Mint/Emerald -->
    <linearGradient id="liquidVial3" x1="0.5" y1="0.0" x2="0.5" y2="1.0">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="45%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Liquid Gradient Vial 4: Glowing Electric Royal Blue -->
    <linearGradient id="liquidVial4" x1="0.5" y1="0.0" x2="0.5" y2="1.0">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="35%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Molten Liquid Gold Stream -->
    <linearGradient id="moltenGold" x1="0.0" y1="0.5" x2="1.0" y2="0.5">
      <stop offset="0%" stop-color="#FFCA28" />
      <stop offset="25%" stop-color="#FFA000" />
      <stop offset="65%" stop-color="#F57C00" />
      <stop offset="100%" stop-color="#E64A19" />
    </linearGradient>

    <!-- Liquid Glass Bead Radial Highlight -->
    <radialGradient id="glassBead" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#FFF9C4" />
      <stop offset="60%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#E65100" />
    </radialGradient>

    <!-- Ambient 3D Drop Shadow for Opaque White-Gray Squircle -->
    <filter id="liquidShadow" x="-20%" y="-20%" width="140%" height="145%">
      <feGaussianBlur stdDeviation="16" in="SourceAlpha" result="blur" />
      <feOffset dx="0" dy="14" result="offset" />
      <feFlood flood-color="#0F172A" flood-opacity="0.22" result="shadowColor" />
      <feComposite in="shadowColor" in2="offset" operator="in" result="shadow" />
      <feMerge>
        <feMergeNode in="shadow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Glow for Molten Stream -->
    <filter id="moltenGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" in="SourceGraphic" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Internal Liquid Glow Filter -->
    <filter id="liquidGlow" x="-20%" y="-15%" width="140%" height="130%">
      <feGaussianBlur stdDeviation="3.5" in="SourceGraphic" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- LAYER 1: OPAQUE WHITE-GRAY SQUIRCLE WITH FROSTED WAVES -->
  <g id="layer-squircle" inkscape:label="Liquid Glass Base" inkscape:groupmode="layer">
    <!-- Base Squircle -->
    <rect x="36" y="36" width="440" height="440" rx="98" ry="98"
          fill="url(#liquidBg)"
          filter="url(#liquidShadow)" />

    <!-- Perfectly Clipped Interior Waves & Glare -->
    <g clip-path="url(#squircleClip)">
      <!-- Frostic Caustic Wave 1 -->
      <path d="M 30 250 C 140 200, 220 370, 360 260 C 420 210, 460 240, 480 270 L 480 480 L 30 480 Z"
            fill="url(#caustic1)" />

      <!-- Frosted Caustic Wave 2 -->
      <path d="M 30 130 C 120 210, 260 120, 380 190 C 440 220, 465 180, 480 170 L 480 30 L 30 30 Z"
            fill="url(#caustic2)" />

      <!-- Smooth Molten Glass Surface Curvature / Specular Glare -->
      <path d="M 36 134 C 36 79.8 79.8 36 134 36 L 378 36 C 432.2 36 476 79.8 476 134 L 476 220 C 350 265, 170 200, 36 275 Z"
            fill="url(#surfaceGlare)" />
    </g>

    <!-- Beveled Frosted Rim -->
    <rect x="37" y="37" width="438" height="438" rx="97" ry="97"
          fill="none" stroke="url(#prismaticRim)" stroke-width="2.0" />
  </g>

  <!-- LAYER 2: SCIENTIFIC GRID MATRIX -->
  <g id="layer-grid" inkscape:label="Grid Matrix" inkscape:groupmode="layer" opacity="0.22">
    <line x1="80" y1="180" x2="432" y2="180" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,5" />
    <line x1="80" y1="250" x2="432" y2="250" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,5" />
    <line x1="80" y1="320" x2="432" y2="320" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,5" />
    <line x1="80" y1="390" x2="432" y2="390" stroke="#475569" stroke-width="2.0" />

    <circle cx="80" cy="180" r="2.5" fill="#475569" />
    <circle cx="80" cy="250" r="2.5" fill="#475569" />
    <circle cx="80" cy="320" r="2.5" fill="#475569" />
    <circle cx="80" cy="390" r="2.5" fill="#475569" />
  </g>

  <!-- LAYER 3: 3D LIQUID GLASS CAPSULES (VIALS) -->
  <g id="layer-vials" inkscape:label="Liquid Glass Vials" inkscape:groupmode="layer">

    <!-- VIAL 1: Aqua / Cyan (x=96, y=270, w=56, h=120) -->
    <g id="vial-1">
      <!-- Outer Glass Tube Body -->
      <rect x="96" y="270" width="56" height="120" rx="20" ry="20"
            fill="#FFFFFF" fill-opacity="0.55"
            stroke="#94A3B8" stroke-opacity="0.45" stroke-width="1.5" />

      <!-- Inner Luminous Liquid Core (Seamless 3D Cylinder Body) -->
      <path d="M 100 282 L 100 370 A 16 16 0 0 0 116 386 L 132 386 A 16 16 0 0 0 148 370 L 148 282 A 24 6 0 0 0 100 282 Z"
            fill="url(#liquidVial1)" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="1.2"
            filter="url(#liquidGlow)" />

      <!-- Left Specular Streak (Left Half, Full Height, Seamlessly Clipped to Liquid Core) -->
      <rect x="100" y="276" width="24" height="110"
            fill="url(#glassStreak)" clip-path="url(#liquidClip1)" />

      <!-- Right Edge Refraction (Right Half, Full Height, Seamlessly Clipped to Liquid Core) -->
      <rect x="124" y="276" width="24" height="110"
            fill="url(#glassRightRefract)" clip-path="url(#liquidClip1)" />

      <!-- Liquid Meniscus Highlight (Flush 3D Surface Rim) -->
      <ellipse cx="124" cy="282" rx="24" ry="6"
               fill="#E0F7FA" fill-opacity="0.90"
               stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="1.2" />

      <!-- Rising Micro Bubbles -->
      <circle cx="120" cy="340" r="2.5" fill="#FFFFFF" opacity="0.7" />
      <circle cx="132" cy="315" r="1.8" fill="#FFFFFF" opacity="0.8" />
    </g>

    <!-- VIAL 2: Neon Violet / Orchid (x=180, y=190, w=56, h=200) -->
    <g id="vial-2">
      <!-- Outer Glass Tube Body -->
      <rect x="180" y="190" width="56" height="200" rx="20" ry="20"
            fill="#FFFFFF" fill-opacity="0.55"
            stroke="#94A3B8" stroke-opacity="0.45" stroke-width="1.5" />

      <!-- Inner Luminous Liquid Core (Seamless 3D Cylinder Body) -->
      <path d="M 184 202 L 184 370 A 16 16 0 0 0 200 386 L 216 386 A 16 16 0 0 0 232 370 L 232 202 A 24 6 0 0 0 184 202 Z"
            fill="url(#liquidVial2)" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="1.2"
            filter="url(#liquidGlow)" />

      <!-- Left Specular Streak (Left Half, Full Height, Seamlessly Clipped to Liquid Core) -->
      <rect x="184" y="196" width="24" height="190"
            fill="url(#glassStreak)" clip-path="url(#liquidClip2)" />

      <!-- Right Edge Refraction (Right Half, Full Height, Seamlessly Clipped to Liquid Core) -->
      <rect x="208" y="196" width="24" height="190"
            fill="url(#glassRightRefract)" clip-path="url(#liquidClip2)" />

      <!-- Liquid Meniscus Highlight (Flush 3D Surface Rim) -->
      <ellipse cx="208" cy="202" rx="24" ry="6"
               fill="#FCE7F3" fill-opacity="0.90"
               stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="1.2" />

      <!-- Micro Bubbles -->
      <circle cx="202" cy="310" r="2.8" fill="#FFFFFF" opacity="0.7" />
      <circle cx="216" cy="260" r="2.0" fill="#FFFFFF" opacity="0.8" />
      <circle cx="205" cy="235" r="1.5" fill="#FFFFFF" opacity="0.8" />
    </g>

    <!-- VIAL 3: Emerald / Neon Mint (x=264, y=240, w=56, h=150) -->
    <g id="vial-3">
      <!-- Outer Glass Tube Body -->
      <rect x="264" y="240" width="56" height="150" rx="20" ry="20"
            fill="#FFFFFF" fill-opacity="0.55"
            stroke="#94A3B8" stroke-opacity="0.45" stroke-width="1.5" />

      <!-- Inner Luminous Liquid Core (Seamless 3D Cylinder Body) -->
      <path d="M 268 252 L 268 370 A 16 16 0 0 0 284 386 L 300 386 A 16 16 0 0 0 316 370 L 316 252 A 24 6 0 0 0 268 252 Z"
            fill="url(#liquidVial3)" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="1.2"
            filter="url(#liquidGlow)" />

      <!-- Left Specular Streak (Left Half, Full Height, Seamlessly Clipped to Liquid Core) -->
      <rect x="268" y="246" width="24" height="140"
            fill="url(#glassStreak)" clip-path="url(#liquidClip3)" />

      <!-- Right Edge Refraction (Right Half, Full Height, Seamlessly Clipped to Liquid Core) -->
      <rect x="292" y="246" width="24" height="140"
            fill="url(#glassRightRefract)" clip-path="url(#liquidClip3)" />

      <!-- Liquid Meniscus Highlight (Flush 3D Surface Rim) -->
      <ellipse cx="292" cy="252" rx="24" ry="6"
               fill="#ECFDF5" fill-opacity="0.90"
               stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="1.2" />

      <!-- Micro Bubbles -->
      <circle cx="286" cy="320" r="2.5" fill="#FFFFFF" opacity="0.7" />
      <circle cx="298" cy="285" r="2.0" fill="#FFFFFF" opacity="0.8" />
    </g>

    <!-- VIAL 4: Royal Electric Blue (x=348, y=140, w=56, h=250) -->
    <g id="vial-4">
      <!-- Outer Glass Tube Body -->
      <rect x="348" y="140" width="56" height="250" rx="20" ry="20"
            fill="#FFFFFF" fill-opacity="0.55"
            stroke="#94A3B8" stroke-opacity="0.45" stroke-width="1.5" />

      <!-- Inner Luminous Liquid Core (Seamless 3D Cylinder Body) -->
      <path d="M 352 152 L 352 370 A 16 16 0 0 0 368 386 L 384 386 A 16 16 0 0 0 400 370 L 400 152 A 24 6 0 0 0 352 152 Z"
            fill="url(#liquidVial4)" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="1.2"
            filter="url(#liquidGlow)" />

      <!-- Left Specular Streak (Left Half, Full Height, Seamlessly Clipped to Liquid Core) -->
      <rect x="352" y="146" width="24" height="240"
            fill="url(#glassStreak)" clip-path="url(#liquidClip4)" />

      <!-- Right Edge Refraction (Right Half, Full Height, Seamlessly Clipped to Liquid Core) -->
      <rect x="376" y="146" width="24" height="240"
            fill="url(#glassRightRefract)" clip-path="url(#liquidClip4)" />

      <!-- Liquid Meniscus Highlight (Flush 3D Surface Rim) -->
      <ellipse cx="376" cy="152" rx="24" ry="6"
               fill="#EFF6FF" fill-opacity="0.90"
               stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="1.2" />

      <!-- Micro Bubbles -->
      <circle cx="370" cy="300" r="3.0" fill="#FFFFFF" opacity="0.7" />
      <circle cx="382" cy="230" r="2.2" fill="#FFFFFF" opacity="0.8" />
      <circle cx="368" cy="190" r="1.8" fill="#FFFFFF" opacity="0.8" />
    </g>
  </g>

  <!-- LAYER 4: MOLTEN GOLD FLUID STREAM & LIQUID GLASS BEADS -->
  <g id="layer-stream" inkscape:label="Molten Stream" inkscape:groupmode="layer" filter="url(#moltenGlow)">
    <!-- Fluid Gold Stream -->
    <path d="M 124 250 C 160 178, 175 162, 208 170 C 245 178, 260 228, 292 214 C 325 198, 345 120, 376 112"
          fill="none" stroke="url(#moltenGold)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- 3D Liquid Glass Spheres / Beads -->
    <!-- Bead 1 -->
    <circle cx="124" cy="250" r="14" fill="#FFA000" opacity="0.25" />
    <circle cx="124" cy="250" r="8.5" fill="url(#glassBead)" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="121.5" cy="247.5" r="2.5" fill="#FFFFFF" />

    <!-- Bead 2 -->
    <circle cx="208" cy="170" r="14" fill="#FFA000" opacity="0.25" />
    <circle cx="208" cy="170" r="8.5" fill="url(#glassBead)" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="205.5" cy="167.5" r="2.5" fill="#FFFFFF" />

    <!-- Bead 3 -->
    <circle cx="292" cy="214" r="14" fill="#FFA000" opacity="0.25" />
    <circle cx="292" cy="214" r="8.5" fill="url(#glassBead)" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="289.5" cy="211.5" r="2.5" fill="#FFFFFF" />

    <!-- Bead 4 (Peak) -->
    <circle cx="376" cy="112" r="16" fill="#E64A19" opacity="0.30" />
    <circle cx="376" cy="112" r="9.5" fill="url(#glassBead)" stroke="#FFFFFF" stroke-width="2.0" />
    <circle cx="373" cy="109" r="3.0" fill="#FFFFFF" />
  </g>

  <!-- LAYER 5: LIQUID GLASS DROPLET EMBLEM (BRAND BADGE) -->
  <g id="layer-badge" inkscape:label="Liquid Droplet Badge" inkscape:groupmode="layer">
    <!-- Glass Orb Base -->
    <circle cx="120" cy="110" r="26" fill="#FFFFFF" fill-opacity="0.65"
            stroke="#94A3B8" stroke-opacity="0.45" stroke-width="1.5" />

    <!-- Specular Crescent on top-left of Orb -->
    <path d="M 102 104 C 104 95, 114 90, 126 92 C 117 94, 108 99, 106 109 Z" fill="#FFFFFF" opacity="0.95" />

    <!-- Inner Refracted Pie Data Droplets -->
    <path d="M 120 96 A 14 14 0 0 1 134 110 L 120 110 Z" fill="#FFB300" />
    <path d="M 120 110 L 134 110 A 14 14 0 1 1 120 96 Z" fill="#0284C7" opacity="0.95" />
  </g>
</svg>
